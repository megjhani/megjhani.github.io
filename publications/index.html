<html lang="en">
<head>
<title>Publications | Murad Megjhani</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="description" content="48+ peer-reviewed publications across NEJM AI, Annals of Neurology, Stroke, NeurIPS, and more — explore the brain.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">

<style>
/* ---- publications explorer layout --------------------------------- */
html, body { height: 100%; overflow: hidden; background: #080a09; }

.pub-page {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
}

/* transparent nav override for full-screen explorer */
.pub-page .site-nav {
  position: relative;
  background: rgba(8,10,9,0.72);
  border-bottom: 1px solid rgba(255,255,255,0.09);
  backdrop-filter: blur(20px);
  z-index: 10;
}

.pub-explorer {
  position: relative;
  flex: 1;
  min-height: 0;
}

#pub-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;   /* finger drag rotates the brain instead of scrolling */
  cursor: grab;
}
#pub-canvas:active { cursor: grabbing; }

/* ---- hover card ---- */
.pub-card {
  position: fixed;
  top: 0; left: 0;
  z-index: 6;
  pointer-events: none;
  max-width: 300px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 15px;
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 10px;
  background: rgba(8,10,9,0.88);
  backdrop-filter: blur(14px);
  box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  opacity: 0;
  transition: opacity 160ms ease;
  will-change: transform;
  transform: translate(-50%, -120%) translate(50vw, 50vh);
}
.pub-card.is-visible { opacity: 1; }
.pub-card-dot {
  width: 9px; height: 9px;
  flex: 0 0 auto;
  margin-top: 4px;
  border-radius: 50%;
  background: var(--dc, #55d6be);
  box-shadow: 0 0 10px var(--dc, #55d6be);
}
.pub-card-body { display: grid; gap: 4px; }
.pub-card-body strong {
  font-size: 0.83rem;
  line-height: 1.3;
  color: #f5f2ea;
  font-weight: 650;
}
.pub-card-body span {
  font-size: 0.70rem;
  color: #e6b85c;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* ---- backdrop ---- */
.pub-backdrop {
  position: fixed;
  inset: 0;
  z-index: 14;   /* above .site-nav (10) — panel behaves as a modal */
  background: rgba(0,0,0,0);
  pointer-events: none;
  transition: background 300ms ease;
}
.pub-backdrop.is-open {
  background: rgba(0,0,0,0.42);
  pointer-events: auto;
}

/* ---- detail panel ---- */
.pub-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  z-index: 15;   /* above nav + backdrop */
  width: min(480px, 100vw);
  background: rgba(8,10,9,0.96);
  border-left: 1px solid rgba(255,255,255,0.10);
  backdrop-filter: blur(24px);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 360ms cubic-bezier(0.32, 0, 0.18, 1);
  overflow-y: auto;
}
.pub-panel.is-open { transform: translateX(0); }

.pub-close {
  position: sticky;
  top: 0;
  align-self: flex-end;
  margin: 20px 20px 0;
  width: 36px; height: 36px;
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  color: #f5f2ea;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 150ms ease;
  z-index: 1;
}
.pub-close:hover { background: rgba(255,255,255,0.14); }

.pub-panel-body {
  padding: 20px 28px 48px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.pp-cat {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--cc, #55d6be);
  font-weight: 650;
}
.pp-cat::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--cc, #55d6be);
  box-shadow: 0 0 8px var(--cc, #55d6be);
  flex: 0 0 auto;
}

.pp-title {
  margin: 0;
  font-size: clamp(1.15rem, 3vw, 1.55rem);
  line-height: 1.25;
  font-weight: 800;
  color: #f5f2ea;
}

.pp-auth {
  margin: 0;
  font-size: 0.86rem;
  color: #b7c2bd;
  line-height: 1.4;
}

.pp-meta {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.pp-venue {
  font-size: 0.80rem;
  color: #55d6be;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  font-weight: 650;
}
.pp-year {
  font-size: 0.78rem;
  color: #b7c2bd;
  letter-spacing: 0.06em;
}

.pp-divider {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.09);
  margin: 0;
}

.pp-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 6px;
}
.pp-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 18px;
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 8px;
  background: rgba(255,255,255,0.04);
  color: #f5f2ea;
  font: inherit;
  font-size: 0.88rem;
  text-decoration: none;
  cursor: pointer;
  transition: background 150ms, border-color 150ms;
}
.pp-btn:hover {
  background: rgba(255,255,255,0.09);
  border-color: rgba(85,214,190,0.5);
  color: #f5f2ea;
}
.pp-btn--primary {
  background: rgba(85,214,190,0.12);
  border-color: rgba(85,214,190,0.4);
  color: #55d6be;
}
.pp-btn--primary:hover { background: rgba(85,214,190,0.22); color: #55d6be; }

/* ---- legend & hint ---- */
.pub-legend {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 4;
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
  pointer-events: none;
}
.pub-legend span {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.65rem;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: rgba(183,194,189,0.75);
}
.pub-legend span::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--lc, #55d6be);
  box-shadow: 0 0 6px var(--lc, #55d6be);
  flex: 0 0 auto;
}

.pub-hint {
  position: absolute;
  bottom: 58px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 4;
  margin: 0;
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(183,194,189,0.55);
  pointer-events: none;
  white-space: nowrap;
  animation: hint-pulse 2.8s ease-in-out infinite;
  transition: opacity 400ms ease;
}

.pub-count {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 4;
  margin: 0;
  font-size: 0.66rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(183,194,189,0.45);
  pointer-events: none;
  text-align: center;
}

.pub-scholar {
  position: absolute;
  right: clamp(18px, 4vw, 48px);
  bottom: 22px;
  z-index: 5;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border: 1px solid rgba(85,214,190,0.34);
  border-radius: 999px;
  background: rgba(8,10,9,0.66);
  backdrop-filter: blur(12px);
  color: rgba(223,253,247,0.92);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
}
.pub-scholar:hover {
  border-color: rgba(85,214,190,0.7);
  background: rgba(85,214,190,0.12);
  transform: translateY(-2px);
}
.pub-scholar svg { width: 15px; height: 15px; fill: #55d6be; }

@media (max-width: 600px) {
  /* stack cleanly bottom-up: legend → scholar pill, hint pinned near top */
  .pub-legend  { gap: 8px 14px; padding: 0 16px; bottom: 18px; }
  .pub-legend span { font-size: 0.58rem; }
  .pub-hint    { font-size: 0.58rem; top: 64px; bottom: auto; white-space: normal; text-align: center; width: calc(100% - 32px); }
  .pub-panel   { width: 100vw; }
  .pub-scholar { left: 50%; right: auto; transform: translateX(-50%); bottom: 64px; }
  .pub-scholar:hover { transform: translateX(-50%) translateY(-2px); }
}
</style>
</head>
<body>
<div class="pub-page">

  <header class="site-nav">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="Murad Megjhani home">
        <strong>Murad Megjhani</strong>
        <span>Neurocritical care AI</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">

        <a href="/teaching/">Teaching</a>

      View all on Google Scholar
    </a>
  </div>

</div><!-- .pub-page -->
