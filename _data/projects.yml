# projects section data
- name: 'Tracing'
  i18n: 'Bioinformatics'
  url: '/megjhani/Bioinformatics'
  img: 'static/img/landing/saplatform.png'
  desc: 'Motivation The arbor morphologies of brain microglia are important indicators of cell activation. This paper fills the need for accurate, robust, adaptive, and scalable methods for reconstruct-ing 3-D microglial arbors & quantitatively mapping microglia acti-vation states over extended brain tissue regions. Results Thick rat brain sections (100-300 m) were multiplex im-munolabeled for IBA1 and Hoechst, and imaged by step-and-repeat confocal microscopy with automated 3-D image mosa-icing, producing seamless images of extended brain regions (e.g., 5,903×9,874×229 voxels). An over-complete dictionary based model was learned for the image-specific local structure of microglial processes. The microglial arbors were reconstructed seamlessly using an automated and scalable algorithm that ex-ploits microglia-specific constraints. This method detected 80.1% and 92.8% more centered arbor points, and 53.5% and 55.5% fewer spurious points than existing vesselness and LoG based methods, respectively, and the traces were 13.1% and 15.5% more accurate based on the DIADEM metric. The arbor morpholo-gies were quantified using Scorcioni’s L-measure. Coifman’s har-monic co-clustering revealed four morphologically distinct clas-ses that concord with known microglia activation patterns. This enabled us to map spatial distributions of microglial activation and cell abundances.
Availability Experimental protocols, sample datasets, scalable open-source multi-threaded software implementation (C++, MATLAB) in the electronic supplement, and website (www.farsight-toolkit.org). .'

- name: 'Morphologically Constrained Spectral Unmixing by Dictionary Learning for Multiplex Fluorescence Microscopy'
  i18n: 'Unmixing_MCSU'
  url: '/megjhani/Unmixing_MCSU'
  img: 'static/img/landing/saplatform.png'
  desc: ' Motivation Current spectral unmixing methods for multiplex fluorescence microscopy have a lim-ited ability to cope with high spectral overlap as they only analyze spectral information over individ-ual pixels. Here, we present adaptive Morphologically Constrained Spectral Unmixing (MCSU) al-gorithms that overcome this limitation by exploiting morphological differences between sub-cellular structures, and their local spatial context. Results The proposed method was effective at improving spectral unmixing performance by ex-ploiting (i) a set of dictionary-based models for object morphologies learned from the image data; and (ii) models of spatial context learned from the image data using a total variation algorithm. The method was evaluated on multi-spectral images of multiplex-labeled pancreatic ductal adenocar-cinoma (PDAC) tissue samples. The former constraint ensures that neighbouring pixels corre-spond to morphologically similar structures, and the latter constraint ensures that neighbouring pixels have similar spectral signatures. The average Mean Squared Error (MSE) and Signal to Re-construction Error (SRE) ratio of the proposed method was 39.6% less and 8% more, respectively, compared to the best of all other algorithms that do not exploit these spatial constraints.
Availability Specimen preparation and imaging protocols, open source software (MATLAB), and website (www.farsight-toolkit.org) '

