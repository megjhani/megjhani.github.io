<!DOCTYPE html>
<html lang="en">
<head>
<title>Projects | Murad Megjhani</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="description" content="Two broad research programs: Neurocritical Care AI (non-invasive ICP, DCI detection, foundation models) and Music &amp; the Brain (neuroaesthetics, EEG, consciousness).">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;800&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="/assets/img/favicon.ico">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="canonical" href="/projects/">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-nav">
  <div class="nav-inner">
    <a class="brand" href="/" aria-label="Murad Megjhani home">
      <strong>Murad Megjhani</strong>
      <span>Neurocritical care AI</span>
    </a>
    <nav class="nav-links" aria-label="Primary navigation">
      <a href="/#research">Research</a>
      <a href="/projects/" class="is-active">Projects</a>
      <a href="/publications/">Publications</a>
      <a href="/teaching/">Teaching</a>
      <a href="/people/">People</a>
      <a href="mailto:mmegjhan@barnard.edu">Contact</a>
      <a class="nav-cta" href="/assets/pdf/CV.pdf">CV</a>
    </nav>
  </div>
</header>
<main id="main" class="projects-experience" data-mode="brain">
  <canvas id="projects-canvas" aria-label="Interactive 3D project gallery"></canvas>

  <section class="projects-copy" aria-live="polite">
    <p class="eyebrow">Interactive project atlas</p>
    <h1>Research <span>projects</span></h1>
    <p id="projects-stage-copy">Begin at the brain, split it into two research hemispheres, then follow each hemisphere&rsquo;s signal into its projects.</p>
  </section>

  <div class="project-stage-actions" id="project-stage-actions">
    <button class="inline-cta project-split-btn" id="project-split-btn" type="button">Split the brain</button>
  </div>

  <div class="pillar-pickers" id="pillar-pickers" aria-label="Choose a research pillar">
    <button class="pillar-picker neuro" type="button" data-pillar="neuro">
      <span>Neurocritical Care AI</span>
      <small>ICP · DCI · EEG · Foundation models</small>
    </button>
    <button class="pillar-picker music" type="button" data-pillar="music">
      <span>Music &amp; the Brain</span>
      <small>Sound · aesthetics · consciousness</small>
    </button>
  </div>

  <div class="gallery-controls" id="gallery-controls" aria-label="Gallery navigation">
    <button class="ghost-cta" id="gallery-back" type="button">&larr; Hemispheres</button>
    <button class="ghost-cta" id="gallery-prev" type="button">Previous project</button>
    <button class="ghost-cta" id="gallery-next" type="button">Next project</button>
  </div>

  <aside class="project-detail" id="project-detail" aria-label="Project details" aria-hidden="true">
    <button class="project-detail-close" id="project-detail-close" type="button" aria-label="Close project details">&#10005;</button>
    <p class="project-detail-kicker" id="project-detail-kicker"></p>
    <h2 id="project-detail-title"></h2>
    <p id="project-detail-body"></p>
    <div class="project-detail-tags" id="project-detail-tags"></div>
  </aside>
</main>
<script type="module" src="/assets/js/projects-gallery.js"></script>
<script src="/assets/js/site.js"></script>
</body>
</html>
